<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register ke Supabase</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f5f5f5;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      width: 340px;
    }

    h2 {
      margin-bottom: 25px;
      font-weight: 600;
      color: #333;
    }

    input {
      width: 310px;
      height: 40px;
      border: none;
      border-radius: 10px;
      background-color: #E4F757;
      font-size: 16px;
      font-weight: 600;
      padding: 8px 12px;
      margin-bottom: 20px;
      outline: none;
      color: #333;
    }

    input::placeholder {
      color: #666;
      font-weight: 400;
    }

    button {
      width: 310px;
      height: 40px;
      background-color: #E4F757;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      color: #333;
    }

    button:hover {
      background-color: #d6e24b;
      transform: scale(1.02);
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Register Form</h2>
    <input type="email" id="email" placeholder="Masukkan Email">
    <input type="password" id="password" placeholder="Masukkan Password">
    <button id="submitBtn">Kirim ke Supabase</button>
  </div>

  <!-- Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <script>
    // ⚙️ GANTI DENGAN PROJECT KAMU SENDIRI
    const SUPABASE_URL = "https://fxybirrqiyvdutxtiaal.supabase.co"; // Project URL kamu
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4eWJpcnJxaXl2ZHV0eHRpYWFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg5ODI3OTAsImV4cCI6MjA3NDU1ODc5MH0.nhSqSY_nur_7NdHPsI3n9rNLK4bx_m0EWaN__8Z_svQ"; // anon key kamu

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById("submitBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (!email || !password) {
        alert("⚠️ Harap isi semua kolom!");
        return;
      }

      const { data, error } = await supabase
        .from("web")
        .insert([{ email: email, password: password }]);

      if (error) {
        console.error("ERROR DETAIL:", error);
        alert("❌ Gagal menyimpan data: " + error.message);
      } else {
        alert("✅ Data berhasil disimpan ke Supabase!");
        document.getElementById("email").value = "";
        document.getElementById("password").value = "";
      }
    });
  </script>

</body>
</html>
